          <figcaption class="ab-figcap"><b>협업 상태 양방향 동기화</b> &#8212; 정방향은 Phase 경계마다 자동으로 이슈를 옮긴다. 어려운 쪽은 역방향이었다. 전부 자동 반영하면 사람이 판단할 변경까지 덮어쓰고, 매번 물으면 승인 피로로 내용을 안 보고 누르게 된다. 그래서 변경을 성격별로 나눠 <b>기계적인 것만</b> 자동 반영하되 승인은 묶어서 한 번만 묻는다. 샌드박스 전 구간 검증에서 설계 허점 4건을 발견해 고쳤다. <a class="ab-plink" href="https://saver7942.blogspot.com/2026/07/linear-mcp.html">연동기 &#8594;</a></figcaption>
