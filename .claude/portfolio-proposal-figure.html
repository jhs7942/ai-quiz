        <figure class="ab-fig" style="margin:0">
<svg viewBox="0 0 1000 322" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="기획안 파이프라인 — 작성과 평가 역할 분리" style="width:100%;height:auto;display:block;font-family:'Noto Sans KR',sans-serif">
  <defs>
    <marker id="ppA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F3A39" opacity="0.55"/>
    </marker>
    <marker id="ppR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8443C"/>
    </marker>
  </defs>

  <text x="30" y="22" font-size="12.5" font-weight="700" fill="#243130">기획 &#183; 쓰는 쪽과 보는 쪽을 나눈다</text>
  <text x="970" y="22" text-anchor="end" font-size="11" fill="#93A97F">산출물은 전부 파일로 남긴다</text>

  <!-- 요구사항 -->
  <rect x="30" y="74" width="112" height="46" rx="10" fill="#FBFBF7" stroke="#2F3A39" stroke-width="1.4" stroke-opacity="0.3"/>
  <text x="86" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243130">요구사항</text>
  <text x="86" y="110" text-anchor="middle" font-size="9.5" fill="#2F3A39" opacity="0.75">판단 기준 고정</text>
  <path d="M144,97 L163,97" stroke="#2F3A39" stroke-width="1.4" opacity="0.5" marker-end="url(#ppA)"/>

  <!-- 병렬 리서치 -->
  <text x="245" y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#93A97F">병렬 &#183; 서로 안 보고 조사</text>
  <g>
    <rect x="167" y="48" width="156" height="28" rx="7" fill="#EAF3EE" stroke="#93A97F" stroke-width="1.4"/>
    <text x="245" y="67" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243130">경쟁 서비스</text>
    <rect x="167" y="83" width="156" height="28" rx="7" fill="#EAF3EE" stroke="#93A97F" stroke-width="1.4"/>
    <text x="245" y="102" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243130">LLM 기술</text>
    <rect x="167" y="118" width="156" height="28" rx="7" fill="#EAF3EE" stroke="#93A97F" stroke-width="1.4"/>
    <text x="245" y="137" text-anchor="middle" font-size="11.5" font-weight="600" fill="#243130">사용자 페르소나</text>
  </g>
  <path d="M325,97 L344,97" stroke="#2F3A39" stroke-width="1.4" opacity="0.5" marker-end="url(#ppA)"/>

  <!-- 초안 -->
  <rect x="348" y="74" width="106" height="46" rx="10" fill="#FBFBF7" stroke="#2F3A39" stroke-width="1.4" stroke-opacity="0.3"/>
  <text x="401" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243130">초안</text>
  <text x="401" y="110" text-anchor="middle" font-size="9.5" fill="#2F3A39" opacity="0.75">주장마다 출처</text>
  <path d="M456,97 L475,97" stroke="#2F3A39" stroke-width="1.4" opacity="0.5" marker-end="url(#ppA)"/>

  <!-- 평가·검토 -->
  <rect x="479" y="74" width="150" height="46" rx="10" fill="#fff" stroke="#C8443C" stroke-width="1.6"/>
  <text x="554" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#C8443C">평가 &#183; 검토</text>
  <text x="554" y="110" text-anchor="middle" font-size="9.5" fill="#2F3A39" opacity="0.8">작성자와 분리</text>
  <path d="M631,97 L650,97" stroke="#2F3A39" stroke-width="1.4" opacity="0.5" marker-end="url(#ppA)"/>

  <!-- v2 반복 루프 -->
  <path d="M554,122 L554,158 L401,158 L401,124" fill="none" stroke="#C8443C" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ppR)"/>
  <text x="478" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#C8443C">보완 필요 &#8594; v2 재작성</text>

  <!-- 제출 검수 -->
  <rect x="654" y="74" width="140" height="46" rx="10" fill="#FBFBF7" stroke="#2F3A39" stroke-width="1.4" stroke-opacity="0.3"/>
  <text x="724" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243130">제출 검수</text>
  <text x="724" y="110" text-anchor="middle" font-size="9.5" fill="#2F3A39" opacity="0.75">심사 기준 8항목</text>
  <path d="M796,97 L815,97" stroke="#2F3A39" stroke-width="1.4" opacity="0.5" marker-end="url(#ppA)"/>

  <!-- 발표자료 -->
  <rect x="819" y="74" width="151" height="46" rx="10" fill="#FBFBF7" stroke="#2F3A39" stroke-width="1.4" stroke-opacity="0.3"/>
  <text x="894" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#243130">발표자료</text>
  <text x="894" y="110" text-anchor="middle" font-size="9.5" fill="#2F3A39" opacity="0.75">32장</text>

  <path d="M30,182 L970,182" stroke="#2F3A39" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- 가중치 -->
  <text x="30" y="206" font-size="11.5" font-weight="700" fill="#243130">평가는 5개 역할 관점에 가중치를 둔다</text>
  <g font-size="11">
    <rect x="30"  y="218" width="104" height="28" rx="8" fill="#EAF3EE" stroke="#2F3A39" stroke-width="1.1" stroke-opacity="0.22"/>
    <text x="82"  y="237" text-anchor="middle" fill="#243130">기획자 <tspan font-weight="700" fill="#C8443C">30%</tspan></text>
    <rect x="142" y="218" width="86" height="28" rx="8" fill="#EAF3EE" stroke="#2F3A39" stroke-width="1.1" stroke-opacity="0.22"/>
    <text x="185" y="237" text-anchor="middle" fill="#243130">UX <tspan font-weight="700" fill="#C8443C">25%</tspan></text>
    <rect x="236" y="218" width="86" height="28" rx="8" fill="#EAF3EE" stroke="#2F3A39" stroke-width="1.1" stroke-opacity="0.22"/>
    <text x="279" y="237" text-anchor="middle" fill="#243130">개발 15%</text>
    <rect x="330" y="218" width="86" height="28" rx="8" fill="#EAF3EE" stroke="#2F3A39" stroke-width="1.1" stroke-opacity="0.22"/>
    <text x="373" y="237" text-anchor="middle" fill="#243130">재정 15%</text>
    <rect x="424" y="218" width="80" height="28" rx="8" fill="#EAF3EE" stroke="#2F3A39" stroke-width="1.1" stroke-opacity="0.22"/>
    <text x="464" y="237" text-anchor="middle" fill="#243130">QA 15%</text>
  </g>
  <text x="30" y="272" font-size="10.5" fill="#2F3A39" opacity="0.8">지적 사항은 파일로 남겨 <tspan font-weight="700" fill="#243130">무엇을 고쳤는지 대조</tspan>할 수 있게 한다</text>

  <!-- 재평가 결과 -->
  <rect x="540" y="196" width="430" height="92" rx="11" fill="#fff" stroke="#C8443C" stroke-width="1.5" stroke-opacity="0.55"/>
  <text x="560" y="218" font-size="11.5" font-weight="700" fill="#C8443C">재평가 결과</text>
  <text x="586" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#2F3A39" opacity="0.55">7.70</text>
  <text x="586" y="270" text-anchor="middle" font-size="10" fill="#2F3A39" opacity="0.7">v1</text>
  <path d="M626,246 L666,246" stroke="#C8443C" stroke-width="1.8" marker-end="url(#ppR)"/>
  <text x="706" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#C8443C">8.60</text>
  <text x="706" y="270" text-anchor="middle" font-size="10" fill="#2F3A39" opacity="0.7">v2</text>
  <path d="M762,208 L762,278" stroke="#2F3A39" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="866" y="240" text-anchor="middle" font-size="11.5" fill="#243130">필수 보완 <tspan font-weight="700">3건</tspan> &#8594; <tspan font-weight="700" fill="#C8443C">1건</tspan></text>
  <text x="866" y="264" text-anchor="middle" font-size="10.5" fill="#2F3A39" opacity="0.75">우수 참여자 선정 (2026.06)</text>
</svg>
          <figcaption class="ab-figcap"><b>기획안 파이프라인</b> &#8212; 같은 맥락이 초안도 쓰고 평가도 하면 자기 확증이 된다. 그래서 작성과 평가를 다른 단계로 떼고, 지적 사항을 파일로 남겨 무엇을 고쳤는지 대조할 수 있게 했다. 리서치도 경쟁&#183;기술&#183;페르소나를 각각 독립 조사해 서로의 결론에 오염되지 않게 한다. 한 번에 끝내지 않고 지적을 반영해 다시 평가를 돌린 결과 <b>7.70 &#8594; 8.60</b>, 필수 보완 3건이 1건으로 줄었다.</figcaption>
        </figure>
